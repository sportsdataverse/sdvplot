[project]
name = "sdvplot"
version = "0.1.0"
description = "Team logos, wordmarks, headshots and colors for Python plots and tables (SportsDataverse)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Saiem Gilani" }]
maintainers = [{ name = "Saiem Gilani" }, { name = "SportsDataverse" }]
keywords = ["sports", "logos", "team colors", "matplotlib", "plotly", "altair", "sportsdataverse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "narwhals>=2.0",
  "polars>=1.24,<2",
  "Pillow>=12.3",
  "platformdirs>=4",
  "requests>=2.33",
]

[project.optional-dependencies]
svg = ["resvg-py>=0.2.5"]
mpl = ["matplotlib>=3.7"]
plotnine = ["plotnine>=0.15"]
plotly = ["plotly>=5.14"]
altair = ["altair>=5.1"]
bokeh = ["bokeh>=3.8.2"]
holoviews = ["holoviews>=1.18", "bokeh>=3.8.2"]
tables = ["great_tables>=1.0", "htmltools>=0.4.1", "nokap>=0.1"]
reactable = ["reactable>=0.1.6"]
folium = ["folium>=0.19"]
surfaces = ["sportypy>=1.0", "mplsoccer>=1.2"]
plottable = ["plottable>=0.1.5"]
pygal = ["pygal>=3.0.1"]  # 3.0.0 imports pkg_resources, absent without setuptools
all = ["sdvplot[svg,mpl,plotnine,plotly,altair,bokeh,holoviews,tables,reactable,folium,surfaces,plottable,pygal]"]

[project.urls]
Homepage = "https://sdvplot.sportsdataverse.org/"
Documentation = "https://sdvplot.sportsdataverse.org/"
Repository = "https://github.com/sportsdataverse/sdvplot"
"Bug Tracker" = "https://github.com/sportsdataverse/sdvplot/issues"
Changelog = "https://sdvplot.sportsdataverse.org/CHANGELOG"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "pytest-mpl>=0.17", "nbmake>=1.5", "pandas>=2", "pyarrow>=15", "numpy>=1.26", "nba_api>=1.5", "seaborn>=0.13", "kaleido>=1.0", "vl-convert-python>=1.6", "cairosvg>=2.9"]
# Gallery packages sdvplot needs no code from: tests/test_compat_*.py prove they work (each skips when absent).
# Floors are the versions checked; the markers follow each package's own Requires-Python.
compat = [
  "cartopy>=0.26; python_version >= '3.11'",
  "geopandas>=1.2; python_version >= '3.11'",
  "geoplot>=0.5.1; python_version >= '3.11'",
  "networkx>=3.7; python_version >= '3.12'",
  "pywaffle>=1.2",
  "dayplot>=0.6",
  "bumplot>=0.2.1",
  "highlight-text>=0.2",
  "flexitext>=0.4",
  "drawarrow>=0.1",
  "pypalettes>=0.2.1",
  "morethemes>=0.8; python_version >= '3.11'",  # imports matplotlib.typing.RcKeyType (matplotlib 3.11+)
  "pyfonts>=1.4",
  "wordcloud>=1.9.6",
]
lint = ["ruff==0.16.10", "mypy>=1.10", "types-requests", "pyyaml>=6"]
docs = ["docstring_parser>=0.16", "nbclient>=0.10", "nbconvert>=7", "nbformat>=5", "ipykernel>=6", "jinja2>=3", "seaborn>=0.13"]
# Real data for the example notebooks, cookbooks, recipes, leaderboards and the automation example (sdv-py's
# loaders read SportsDataverse release files and ESPN): executed by tools/render_notebooks.py, never imported by sdvplot.
examples = ["sportsdataverse>=0.1.4"]
dev = [{ include-group = "test" }, { include-group = "compat" }, { include-group = "lint" }, { include-group = "docs" }, { include-group = "examples" }, "pre-commit>=3.7", "nbstripout>=0.7"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdvplot"]

[tool.hatch.build.targets.sdist]
exclude = [
  "docs", ".github", ".vscode", "examples", "CLAUDE.md",
  "uv.lock", "tools", "data-raw", ".coderabbit.yaml", ".env.example", ".markdownlint-cli2.yaml",
  ".pre-commit-config.yaml", ".yamlfmt", ".python-version", ".omc",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -ra lists every skip with its reason; an unregistered marker or a misspelled ini key is an error, not a no-op
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
  "ignore:open_text is deprecated:DeprecationWarning",  # sportypy 1.0 reads its surface specs with it
  "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",  # pygal 3.1 labels DateTimeLine axes with it
]
markers = [
  "real_index: run against the shipped index instead of the hand-written fixture (tests/conftest.py)",
  "render: renders through a headless Chrome (Plotly kaleido, great_tables gtsave / nokap) or vl-convert (Altair, no Chrome); skipped when Chrome cannot start",
]

[tool.ruff]
line-length = 120
src = ["src", "tests", "tools"]
# Generated pages (tools/gen_docs.py, tools/render_notebooks.py): their generators own the bytes and the drift gates
# compare them, so ruff (which formats Python in Markdown since 0.16) must not rewrite them.
extend-exclude = [
  "docs/docs/reference",
  "docs/docs/tutorials",
  "docs/docs/cookbooks",
  "docs/docs/recipes",
  "docs/docs/leaderboards",
  "docs/docs/gallery.md",
  "docs/src/pages/CHANGELOG.md",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
files = ["src/sdvplot", "tests/test_types.py"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# plotly ships no py.typed: read its source, so the front door's plotly Figure overload is checked, not Any
# (tests/test_types.py). It re-exports its classes without __all__, which --strict would flag at every go.Figure.
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
follow_untyped_imports = true
implicit_reexport = true

[tool.coverage.run]
branch = true
source_pkgs = ["sdvplot"]

[tool.coverage.report]
# Set just under the measured total (96% line+branch on the offline suite); raise it as tests land.
fail_under = 94
