[project]
name = "sdvplot"
version = "0.1.0"
description = "Team logos, wordmarks, headshots and colors for Python plots and tables (SportsDataverse)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Saiem Gilani" }]
keywords = ["sports", "logos", "team colors", "matplotlib", "plotly", "altair", "sportsdataverse"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "narwhals>=2.0",
  "polars>=1.0,<2",
  "Pillow>=10",
  "platformdirs>=4",
  "requests>=2.31",
]

[project.optional-dependencies]
svg = ["resvg-py>=0.2"]
mpl = ["matplotlib>=3.7"]
plotnine = ["plotnine>=0.15"]
plotly = ["plotly>=5"]
altair = ["altair>=5"]
bokeh = ["bokeh>=3"]
holoviews = ["holoviews>=1.18"]
tables = ["great_tables>=1.0", "htmltools>=0.4.1", "nokap>=0.1"]
reactable = ["reactable>=0.1.6"]
folium = ["folium>=0.15"]
surfaces = ["sportypy>=1.0", "mplsoccer>=1.2"]
plottable = ["plottable>=0.1.5"]
all = ["sdvplot[svg,mpl,plotnine,plotly,altair,bokeh,holoviews,tables,reactable,folium,surfaces,plottable]"]

[project.urls]
Homepage = "https://sdvplot.sportsdataverse.org/"
Documentation = "https://sdvplot.sportsdataverse.org/"
Repository = "https://github.com/sportsdataverse/sdvplot"
"Bug Tracker" = "https://github.com/sportsdataverse/sdvplot/issues"
Changelog = "https://sdvplot.sportsdataverse.org/CHANGELOG"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "pytest-mpl>=0.17", "nbmake>=1.5", "pandas>=2", "pyarrow>=15", "numpy>=1.26", "nba_api>=1.5", "seaborn>=0.13"]
lint = ["ruff==0.15.12", "mypy>=1.10", "types-requests", "pyyaml>=6"]
docs = ["docstring_parser>=0.16", "nbclient>=0.10", "nbconvert>=7", "nbformat>=5", "ipykernel>=6", "jinja2>=3", "seaborn>=0.13"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "docs" }, "pre-commit>=3.7", "nbstripout>=0.7"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdvplot"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github", ".vscode", "examples", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "error::sdvplot._errors.SdvplotWarning",
  "ignore:open_text is deprecated:DeprecationWarning",  # sportypy 1.0 reads its surface specs with it
]
markers = [
  "real_index: run against the shipped index instead of the hand-written fixture (tests/conftest.py)",
  "render: renders through a headless Chrome (great_tables gtsave / nokap); skipped when none can start",
]

[tool.ruff]
line-length = 120
src = ["src", "tests", "tools"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
files = ["src/sdvplot"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
