<script>
(function () {
  function send() {
    var h = Math.max(document.documentElement.getBoundingClientRect().height, document.body.scrollHeight);

  }
  addEventListener("load", send);
  addEventListener("message", function (e) { if (e.data === "sdvplot:height?") send(); });

})();
