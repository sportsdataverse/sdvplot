name: Feature request
description: Suggest a new league, source, adapter, function, or capability.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For data-source additions, please confirm the
        upstream is publicly accessible (no auth wall, no scraping anti-bot
        wall) and link the canonical reference. For a new plotting library,
        say how it draws an image (an image mark, glyph or URL).

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: |
        Show what calling the new feature would look like in Python. Follow the existing sdvplot signatures: the
        leading arguments positional (`team, league` for marks, `league, teams` for colors, the plot and its data for
        an adapter), every other argument keyword-only (`season=`, `id_system=`, `strict=`).
      render: python
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Upstream source
      description: |
        Where does the data or the library live? Endpoint URL, release tag, parquet path, package page,
        documentation link.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Area
      multiple: true
      options:
        - resolve
        - suggest
        - teams
        - palette
        - team_colors
        - logo_url
        - logo_image
        - marks
        - headshot_url
        - add_logos
        - add_wordmarks
        - add_headshots
        - axis_logos
        - surface
        - court_coords
        - versions
        - clear_cache
        - an adapter submodule (sdvplot.matplotlib, sdvplot.plotly, ...)
        - sdvplot.great_tables helpers
        - sdvplot.reactable or sdvplot.plottable column helpers
        - a new adapter (a library sdvplot does not draw on yet)
        - a new league or data source
        - something else
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any existing workarounds or partial solutions?

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I've searched [existing issues](https://github.com/sportsdataverse/sdvplot/issues) to confirm this isn't already proposed.
          required: true
