name: Bug report
description: Something is broken or behaves incorrectly.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in the fields below — they help us
        reproduce and prioritize the issue. If you're not sure whether it's a
        bug or a usage question, file it anyway: usage questions are welcome here.
        A team that resolves wrongly, or a wrong logo or color, has its own template.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
      placeholder: |
        Calling `sdvplot.add_logos(ax, df["x"], df["y"], df["team"], league="nfl")` raises X, but I expected Y.
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: Smallest code snippet that triggers the bug. Include any required env vars (SDVPLOT_CACHE_DIR, SDVPLOT_CACHE_TTL).
      render: python
      placeholder: |
        import sdvplot
        sdvplot.logo_url("KC", "nfl")
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or warning (if applicable)
      description: Paste the COMPLETE error or SdvplotWarning output. Don't truncate.
      render: text

  - type: dropdown
    id: library
    attributes:
      label: Plotting or table library
      description: The library the call draws on (the adapter, or the column helpers).
      multiple: true
      options:
        - none (core functions only)
        - matplotlib
        - seaborn
        - plotnine
        - plotly
        - altair
        - bokeh
        - holoviews
        - folium
        - pygal
        - great_tables
        - reactable
        - plottable
        - sportypy (surface)
    validations:
      required: true

  - type: dropdown
    id: league
    attributes:
      label: League
      description: The league key the call passed, if any.
      options:
        - not league-specific
        - aaf
        - ahl
        - cfb
        - cricket
        - echl
        - mbb
        - milb
        - mlb
        - nba
        - nbagl
        - ncaa_baseball
        - ncaa_mhockey
        - ncaa_softball
        - ncaa_whockey
        - nfl
        - nhl
        - ohl
        - phf
        - pwhl
        - qmjhl
        - soccer
        - ufl
        - usfl
        - ushl
        - wbb
        - whl
        - wnba
        - xfl

  - type: textarea
    id: sdv_version
    attributes:
      label: sdvplot versions
      description: Output of `import sdvplot; print(sdvplot.versions())` (the package, bundled index and logo manifest versions).
      render: python
      placeholder: "{'sdvplot': '0.1.0', 'index': '...', 'manifest_last_modified': '...'}"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Output of `python --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other (please specify in summary)
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Pre-flight checks
      options:
        - label: I've searched [existing issues](https://github.com/sportsdataverse/sdvplot/issues) and confirmed this isn't a duplicate.
          required: true
        - label: I've reproduced this on the latest release (or main, if I'm running from source).
          required: true
