# Weekly run of the social automation example (examples/automation/sdvplot_social.py) on live ESPN data, so the
# example keeps working. It makes the graphics, prints the would-be posts and uploads out/ as an artifact.
# Nothing is posted: this workflow has no Bluesky secrets and never passes --post, and the script also
# refuses --post in sdvplot's own GitHub Actions.
name: automation-example
on:
  schedule:
    - cron: "30 13 * * 1" # Mondays 13:30 UTC: the weekend's games are final
  workflow_dispatch:
  pull_request:
    paths:
      - examples/automation/**
      - .github/workflows/automation-example.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dry-run:
    name: social graphics (dry-run)
    runs-on: ubuntu-latest # ships Chrome, which the leaderboard tables render in
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "3.13" }
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen
      - name: Make the graphics (live data)
        # NFL is in season in the fall and NBA in the winter; the other runs exercise the offseason fallbacks.
        run: |
          set -euo pipefail
          script=examples/automation/sdvplot_social.py
          uv run --frozen python "$script" leaderboard --league nfl
          uv run --frozen python "$script" leaderboard --league nba --size landscape
          uv run --frozen python "$script" gameday --league nfl
          uv run --frozen python "$script" gameday --league nba
      - name: Print the would-be posts (dry-run)
        run: |
          for manifest in out/*/manifest.json; do
            uv run --frozen python examples/automation/sdvplot_social.py post --manifest "$manifest"
          done
      - name: Upload the images and manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: automation-example-out
          path: out/
          if-no-files-found: error
          retention-days: 14
