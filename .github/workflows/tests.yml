# Offline tests on 3.10-3.13 (Linux, with branch coverage), Windows + macOS, a lowest-direct-versions job, the sdist's own
# tests, and the built wheel with no extras (3.10 + 3.14); live tests (real network) on manual runs
# (and weekly in live-tests-cron).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_tests:
        description: "Set SDVPLOT_LIVE_TESTS=1 to include live network tests"
        required: false
        default: "true"

concurrency:
  # a PR's runs share one group (a new push supersedes the last); each push to main gets its own, so it is never
  # cancelled or replaced while it waits
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # a PR's new push supersedes its last run; a run on main is the merge's only test record, so it is never cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  offline:
    name: pytest (offline, py${{ matrix.python }})
    timeout-minutes: 30  # a run takes ~5 min; a hung one used to hold the runner for 6 h
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "${{ matrix.python }}" }
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen
      - name: Run tests (offline, with branch coverage)
        env:
          SDVPLOT_RENDER_TESTS: "1"   # ubuntu-latest ships Chrome: a render test that cannot render fails
        # The image baselines are rendered with the newest matplotlib, which py3.13 resolves. py3.10 resolves an older
        # matplotlib (3.10.x) whose image-edge antialiasing differs, so only the py3.13 job compares images.
        run: uv run --frozen pytest -q --maxfail=10 --cov=sdvplot --cov-branch --cov-report=term-missing:skip-covered ${{ matrix.python == '3.13' && '--mpl --mpl-results-path=mpl-results' || '' }}
      - name: Upload image comparisons (baseline, result, diff) when they fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mpl-results-py${{ matrix.python }}
          path: mpl-results/
          if-no-files-found: ignore

  # Windows and macOS: the cache (atomic replace, paths, platformdirs), images and the front door are OS-sensitive.
  # Render tests and image baselines stay on Linux (they need Chrome and the baselines' font stack).
  os-matrix:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    timeout-minutes: 30  # a run takes ~5 min; a hung one used to hold the runner for 6 h
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "${{ matrix.python }}" }
      - name: Install project + extras + test group
        run: uv sync --all-extras --no-default-groups --group test --frozen
      - name: Run tests (offline)
        run: uv run --frozen pytest -q --maxfail=10

  # Every declared floor must work: resolve each direct dependency to its lowest allowed version and run the suite.
  lowest-direct:
    name: pytest (lowest direct versions, py3.10)
    timeout-minutes: 30  # a run takes ~5 min; a hung one used to hold the runner for 6 h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, python-version: "3.10" }
      - name: Install project + extras + test group at their floors
        run: uv sync --resolution lowest-direct --all-extras --no-default-groups --group test
      - name: Run tests (offline, no image comparison)
        run: uv run --no-sync pytest -q --maxfail=10

  # The published sdist has no tools/, docs/ or data-raw/: its tests must still pass (a new repo-only test has to be
  # added to the skip table in tests/conftest.py).
  sdist:
    name: pytest (from the sdist, py3.13)
    timeout-minutes: 30  # a run takes ~5 min; a hung one used to hold the runner for 6 h
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "3.13" }
      - name: Build the sdist and unpack it outside the checkout
        run: |
          uv build --sdist --out-dir "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP"/dist/sdvplot-*.tar.gz -C "$RUNNER_TEMP/unpacked"
      - name: Install the unpacked sdist with extras and test deps
        working-directory: ${{ runner.temp }}/unpacked
        run: |
          cd sdvplot-*/
          uv venv
          uv pip install -e '.[all]' --group test
      - name: Run tests (offline)
        working-directory: ${{ runner.temp }}/unpacked
        env:
          SDVPLOT_RENDER_TESTS: "1"
        run: |
          cd sdvplot-*/
          .venv/bin/python -m pytest -q --maxfail=10

  # The wheel a user gets from PyPI, installed with no extras: every other job installs extras, so a core module that
  # imported an optional library would pass them all. Then [all] imports every public submodule. 3.14 is the newest
  # Python the classifiers claim.
  wheel:
    name: wheel (no extras, then [all]; py${{ matrix.python }})
    timeout-minutes: 30  # a run takes ~5 min; a hung one used to hold the runner for 6 h
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, python-version: "${{ matrix.python }}" }
      - name: Build the wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - name: Core with no extras
        working-directory: ${{ runner.temp }}
        run: |
          uv venv bare
          uv pip install --python bare dist/sdvplot-*.whl
          bare/bin/python -c 'import sdvplot as s, sdvplot.typing; assert len(s.teams("nfl")) == 32; assert s.team_colors("nfl", "KC") == "#e31837"; assert s.palette("nfl")["KC"] == "#e31837"'
      - name: Every public submodule with [all]
        working-directory: ${{ runner.temp }}
        run: |
          uv venv all
          uv pip install --python all "$(ls dist/sdvplot-*.whl)[all]"
          all/bin/python -c 'import importlib, pkgutil, sdvplot; [importlib.import_module(f"sdvplot.{m.name}") for m in pkgutil.iter_modules(sdvplot.__path__) if not m.name.startswith("_")]'

  live:
    name: pytest (live, py3.13)
    timeout-minutes: 45
    # Live endpoints are third-party and flaky: an outage must not turn main red. Manual runs only here; the weekly
    # live-tests-cron workflow runs them on a schedule and opens the refresh PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "3.13" }
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen
      - name: Run tests (live network tests included)
        env:
          SDVPLOT_LIVE_TESTS: ${{ github.event.inputs.live_tests != 'false' && '1' || '' }}
        run: uv run --frozen pytest -q --maxfail=10 --mpl
