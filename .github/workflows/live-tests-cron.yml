# Weekly drift detector for the live-network tests (SDVPLOT_LIVE_TESTS=1) and the
# example notebooks. On failure, opens (or updates) a single tracking issue
# labeled `live-tests:drift`; a green run closes it.
name: live-tests-cron
on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday at 13:00 UTC
  workflow_dispatch:
permissions:
  contents: read # each job below widens only what it needs
concurrency:
  group: live-tests-cron
  cancel-in-progress: false
env:
  # Everything tools/render_notebooks.py and tools/home_figures.py write: the notebook pages of every section
  # (with their figures and _category_.json), the framed interactive outputs, the gallery page, thumbnails and
  # sidecars, the downloadable notebook copies, and the home page figures. One path per line.
  GENERATED_PATHS: |-
    docs/docs/tutorials
    docs/docs/cookbooks
    docs/docs/recipes
    docs/docs/leaderboards
    docs/docs/gallery.md
    docs/static/outputs
    docs/static/img/gallery
    docs/src/data/gallery
    docs/static/notebooks
    docs/static/img/home
    docs/src/data/home_figures.json
jobs:
  live:
    name: pytest --live (ubuntu / py3.13)
    runs-on: ubuntu-latest
    # Every notebook runs twice (nbmake, then the render), each live: ~30 notebooks at up to a few minutes each.
    timeout-minutes: 240
    # Runs the tests and notebooks (project + third-party code), so it holds a read-only token:
    # any step can read a job's token from the runner, so write access lives in the jobs below.
    permissions:
      contents: read
    outputs:
      pytest_status: ${{ steps.run-pytest.outcome }}
      render_status: ${{ steps.render.outcome }}
      render_failed: ${{ steps.render.outputs.failed || steps.figures.outputs.failed }}
      has_changes: ${{ steps.tutorial-changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          # No token on disk while project and third-party code runs.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "3.13" }
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen
      - name: Run live tests
        id: run-pytest
        env:
          SDVPLOT_LIVE_TESTS: "1"
        # --maxfail=10 keeps the report focused on the first cluster of
        # failures rather than running through 30+ flaky timeouts.
        # tee the output so the next step can grep it for the failure
        # summary that lands in the tracking issue.
        run: |
          set -o pipefail
          uv run --frozen pytest --maxfail=10 -rN 2>&1 | tee pytest-live.log
      - name: Run example notebooks (nbmake)
        # !cancelled(): run even when the live tests failed, so a drift week still gets the notebook signal.
        if: ${{ !cancelled() }}
        # The example notebooks hit the same live APIs. Flakiness here shouldn't
        # mask the core live-test drift signal (the tracking issue keys off the
        # live tests and the tutorial render), so this leg is informational: continue-on-error with a
        # separate uploaded log. A reproducible notebook break still surfaces here.
        continue-on-error: true
        env:
          SDVPLOT_LIVE_TESTS: "1"
        run: |
          set -o pipefail
          uv run --frozen pytest --nbmake --nbmake-timeout=600 examples/notebooks/ -q -rN 2>&1 | tee pytest-notebooks.log
      - name: Render the notebook pages
        # Re-execute every example notebook (examples/notebooks/**) and render it, with its outputs, to its
        # section's pages, framed outputs and gallery cards. Only from main: a dispatch from another branch would
        # otherwise build the refresh PR on top of that branch's unmerged commits.
        id: render
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          SDVPLOT_LIVE_TESTS: "1"
        run: |
          # render_notebooks.py exits 1 if ANY notebook fails, but still writes the
          # pages that did render (a failed notebook keeps its prior page). Record
          # the failure for the drift issue instead of failing here, so one flake
          # never skips publishing the pages that did render.
          set -o pipefail
          if ! uv run --frozen python tools/render_notebooks.py 2>&1 | tee render-notebooks.log; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Draw the home page figures
        # tools/home_figures.py redraws the home page's PNGs with the matplotlib adapter (live logos and headshots)
        # and their alt text. It writes nothing unless every figure drew, so a failure keeps the committed set;
        # the failure is recorded for the drift issue like the render's, and its log goes in the same file.
        id: figures
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        env:
          SDVPLOT_LIVE_TESTS: "1"
        run: |
          set -o pipefail
          if ! uv run --frozen python tools/home_figures.py 2>&1 | tee -a render-notebooks.log; then
            echo "failed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect changes to the generated pages
        id: tutorial-changes
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        # git status, not git diff: a new notebook renders untracked pages, outputs and thumbnails.
        run: |
          mapfile -t paths <<< "$GENERATED_PATHS"
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload the generated pages
        if: ${{ !cancelled() && steps.tutorial-changes.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: rendered-tutorials
          # several paths: the artifact keeps them relative to their common parent, docs/
          path: ${{ env.GENERATED_PATHS }}
          if-no-files-found: error
          retention-days: 7
      - name: Upload notebook render log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-notebooks-log
          path: render-notebooks.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload notebook execution log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-notebooks-log
          path: pytest-notebooks.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-live-log
          path: pytest-live.log
          if-no-files-found: warn
          retention-days: 30

  # Publishes the rendered tutorials on a fresh runner that executes no project code.
  publish:
    name: tutorials refresh PR
    needs: live
    if: ${{ !cancelled() && needs.live.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tutorials-refresh branch
      pull-requests: write # open the tutorials-refresh PR
      actions: write # dispatch the checks on the refresh PR (GITHUB_TOKEN pushes trigger no workflows)
    steps:
      - uses: actions/checkout@v5
      - name: Clear the generated paths
        # the artifact holds these paths whole, as the live job left them; extracting over the checkout alone would
        # keep a figure, framed output, thumbnail or home PNG the generators deleted (a moved cell, a removed figure)
        run: |
          mapfile -t paths <<< "$GENERATED_PATHS"
          rm -rf "${paths[@]}"
      - name: Download the generated pages and home figures
        uses: actions/download-artifact@v8
        with:
          name: rendered-tutorials
          path: docs
      - name: Open / update the refresh PR
        # main is PR-only, so push a refresh branch and open/update a PR.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t paths <<< "$GENERATED_PATHS"
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "No notebook page or home figure changes to publish."
            exit 0
          fi
          branch="auto/tutorials-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          for p in "${paths[@]}"; do
            # a path neither on disk nor tracked (a section with no notebooks yet) would fail git add
            if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then git add -A -- "$p"; fi
          done
          git commit -m "docs(tutorials): refresh executed notebook pages and home figures"
          git push -f origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "docs(tutorials): weekly refresh of executed notebook pages and home figures" \
              --body "Automated re-execution + render of \`examples/notebooks/\` to the notebook pages, framed outputs and gallery by \`render_notebooks.py\`, and the home page figures by \`tools/home_figures.py\` (live-tests-cron). Review the output diffs and merge to refresh them."
          fi
          # A push made with GITHUB_TOKEN starts no workflows, so dispatch the checks
          # that guard the rendered pages; their runs attach to the PR's head commit.
          gh workflow run docs-build.yml --ref "$branch"
          gh workflow run drift.yml --ref "$branch"

  report:
    name: drift tracking issue
    needs: live
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # open / update / close the drift tracking issue
    steps:
      - name: Download the logs
        continue-on-error: true # a missing log is reported in the issue body
        uses: actions/download-artifact@v8
        with:
          pattern: "*-log"
          merge-multiple: true
      # Open or update the drift tracking issue on failure. One issue
      # per drift event — subsequent failures comment on the same issue
      # so we don't fan out into a stream of duplicates. Closing the
      # issue (e.g. after fixing the regression) resets state.
      - name: Open / update drift tracking issue
        # Also opens when only the tutorial render failed (that step records it instead of failing).
        # main only (a branch dispatch tests that branch, not main); a timed-out pytest step ends 'cancelled'.
        if: >-
          ${{ github.ref == 'refs/heads/main' && (needs.live.outputs.pytest_status == 'failure'
          || needs.live.outputs.pytest_status == 'cancelled' || needs.live.outputs.render_failed == '1') }}
        uses: actions/github-script@v9
        env:
          LOG_FILE: ${{ needs.live.outputs.pytest_status != 'success' && 'pytest-live.log' || 'render-notebooks.log' }}
        with:
          script: |
            const fs = require('fs');
            const logFile = process.env.LOG_FILE;
            let logTail = '';
            try {
              const log = fs.readFileSync(logFile, 'utf8');
              // Last 4 KB of the log -- usually contains the summary lines
              // plus enough context to identify which assertions failed.
              logTail = log.slice(-4000);
            } catch (e) {
              logTail = `(could not read ${logFile}: ${e.message})`;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Scheduled live-tests run on **${today}** failed.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `<details><summary>Last 4KB of ${logFile}</summary>`,
              ``,
              '```',
              logTail,
              '```',
              ``,
              `</details>`,
              ``,
              `Likely causes:`,
              `- The sdv-assets manifest changed its columns or URLs.`,
              `- A CDN asset moved.`,
              `- nflverse's players or teams release changed.`,
              `- A team relocated or rebranded, so the bundled index needs a \`tools/fetch_sources.py\` refresh.`,
              ``,
              `**Resolve by**: fixing the loader / source, then closing this issue. The next cron run that goes green will leave the issue closed.`,
            ].join('\n');

            // Find an open drift issue. The label name is the dedup key.
            const label = 'live-tests:drift';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });
            if (open.data.length > 0) {
              const issue = open.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `Re-occurred on ${today}.\n\n${body}`,
              });
              core.info(`Commented on existing drift issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                title: `Live-tests drift detected (${today})`,
                body:  body,
                labels: [label],
              });
              core.info(`Opened new drift issue #${created.data.number}`);
            }

      # Close the tracking issue when the run goes green. Without this the
      # workflow only ever OPENS issues -- the body above promises "the next
      # cron run that goes green will leave the issue closed", and nothing
      # would execute that, so a fixed drift would stay open indefinitely.
      - name: Close drift tracking issue on green
        # A completed render is required: a branch dispatch skips it, which proves nothing.
        if: >-
          ${{ needs.live.outputs.pytest_status == 'success' && needs.live.outputs.render_status == 'success'
          && needs.live.outputs.render_failed != '1' }}
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'live-tests:drift';
            const today = new Date().toISOString().slice(0, 10);
            // paginate: listForRepo returns ONE page, so a plain call would
            // leave every drift issue past the page size open.
            const found = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            // The issues endpoint also returns pull requests. A PR carrying the
            // drift label is not a tracking issue and must not be closed here.
            const open = found.filter((i) => !i.pull_request);
            if (open.length === 0) {
              core.info('No open drift issue to close.');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: `Live tests went green on ${today} — closing automatically.\n\nRun: ${runUrl}\n\nIf the drift returns, the next failing run reopens tracking by filing a fresh issue with the \`${label}\` label.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed drift issue #${issue.number}`);
            }
