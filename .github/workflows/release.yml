# Build on a GitHub Release (or manual dry run) and publish to PyPI with Trusted Publishing (OIDC): no token is
# stored. The build job has no OIDC permission; only publish-pypi holds `id-token: write`, behind the `pypi`
# environment. One-time setup on pypi.org: a pending Trusted Publisher for project `sdvplot` (owner
# sportsdataverse, repo sdvplot, workflow release.yml, environment pypi).
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The gates run in one job and the dist is built in another, from a fresh checkout: nothing the test run installs
  # (851 locked packages) can touch the tree that is packaged.
  test:
    name: Test the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung test run must fail, not hold release day for 6 h
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        # no cache: a cache written by another workflow on main must not feed a release run (zizmor cache-poisoning);
        # a pinned uv, so the release does not change with uv's latest
        with: { version: "0.12.21", enable-cache: false, python-version: "3.13" }
      - name: Install project + extras + dep groups
        run: uv sync --all-extras --all-groups --frozen
      - name: Tag matches the project version
        if: github.event_name == 'release'
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match the project version $version" >&2
            exit 1
          fi
      - name: Run tests
        env:
          # a release run also checks the README (the PyPI page) and the CHANGELOG are ready for this tag
          SDVPLOT_RELEASE_VERSION: ${{ github.event_name == 'release' && github.ref_name || '' }}
        run: uv run --frozen pytest -q
      - name: Bundled index drift
        run: uv run --frozen python tools/build_index.py --check
  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with: { version: "0.12.21", enable-cache: false, python-version: "3.13" }
      - name: Build sdist + wheel
        run: uv build
      - name: The wheel to publish installs bare and runs its core
        # the exact file that is uploaded, with no extras (the tests ran on the source tree, not on this build)
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/sdvplot-*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c 'import sdvplot as s; assert len(s.teams("nfl")) == 32; assert s.palette("nfl")["KC"] == "#e31837"'
      - name: Every extra of the wheel resolves from PyPI alone
        # pyproject's [tool.uv.sources] is not in the published metadata: a floor only a git source meets (sportypy 1.2
        # while PyPI had 1.0) would make `pip install "sdvplot[all]"` fall back to an older sdvplot. The wheel is pinned
        # by its path here, so such an extra fails the resolve, and the release stops before the upload.
        run: |
          wheel=(dist/sdvplot-*.whl)
          uv pip install --dry-run --no-sources --python "$RUNNER_TEMP/smoke" "${wheel[0]}[all]"
      - name: Upload build artifacts for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # workflow_dispatch builds and uploads artifacts but never publishes.
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/sdvplot
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts from the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        # v1.14.2, pinned by commit SHA
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist
          # a re-run after a partial upload skips the files already on PyPI instead of failing on them
          skip-existing: true
