# Generated artifacts and repo invariants must match their sources.
name: drift
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a run on main is that merge's record
permissions:
  contents: read
jobs:
  drift:
    name: generated files + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with: { version: "latest", enable-cache: true, cache-dependency-glob: "uv.lock", python-version: "3.13" }
      - name: Install project + extras + dep groups (fails if uv.lock is stale)
        run: uv sync --all-extras --all-groups --locked
      - name: Bundled index drift
        run: uv run --frozen python tools/build_index.py --check
      - name: Reference docs drift
        run: uv run --frozen python tools/gen_docs.py --check
      - name: Line-ending, mirror and notebook-output invariants
        run: uv run --frozen pytest -q tests/test_repo_files.py tests/test_notebooks.py
